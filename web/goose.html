<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gilded Goose</title>
    <meta name="description" content="Tell Goose what you want and the most you'll pay. It watches every price, refuses scams, and waits for your tap in PayPal. Practice only: no real money." />
    <meta name="theme-color" content="#f5f4f3" />
    <link rel="icon" href="/site/goose-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/site/goose-icon-256.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/site/goose-touch-180.png" />
    <!-- The bench colour (tokens.css --surface) before any stylesheet, so the first paint never flashes. -->
    <style>html,body{margin:0;background:#f5f4f3;color:#111815}</style>
  </head>
  <body>
    <!-- The loading screen until the app's first render replaces it: the golden egg rocking on its base (ui/Egg.tsx EggLoader). -->
    <div id="root"><div class="boot" role="status"><img src="/site/egg.webp" alt="" width="96" height="88" /><span>Loading Gilded Goose</span></div></div>
    <style>.boot{min-height:100svh;display:grid;place-items:center;align-content:center;gap:16px;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#707070}.boot img{display:block;transform-origin:50% 88%}@media (prefers-reduced-motion:no-preference){.boot img{animation:boot-rock 1.8s cubic-bezier(.77,0,.175,1) infinite}}@keyframes boot-rock{0%,62%,100%{rotate:0deg}14%{rotate:-5deg}30%{rotate:4deg}44%{rotate:-2deg}54%{rotate:1deg}}</style>
    <noscript><p style="padding:24px;font-family:system-ui">Gilded Goose needs JavaScript to shop. Nothing was paid.</p></noscript>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
