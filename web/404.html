    <!-- B-11 (brand.md §10.1): the lockup's sheet, web/src/brand/lockup.css verbatim, so a bar drawn here wears it before any script -->
<style data-gg>
/* The lockup "Gilded G◯ose" (brand.md §10.1): Hanken 400, -.02em (the bar .05em), the vector egg as the first o of Goose. Each HTML entry's <head> carries this file verbatim (core/test/brand.test.ts), so a bar painted before any script wears it. */
.gg { display: inline-flex; align-items: baseline; font-family: var(--mark-face, var(--display)); font-weight: var(--mark-w, 400); letter-spacing: var(--mark-track, -.02em); line-height: 1; color: var(--ink, #f4eadc); white-space: nowrap; font-kerning: normal; text-decoration: none; }
.gg .sp { display: inline-block; width: .24em; }
.gg .o { display: inline-block; width: .5em; height: .62em; margin: 0 .035em 0 .025em; transform: translateY(.012em); }
.gg .o svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* The name in the visible text too (WCAG 2.5.3, axe label-content-name-mismatch): a real space in .sp and a real "o" under the egg, so the link reads "Gilded Goose" to voice control and to copy. The o is out of flow (absolute at its static place, so the egg's box and baseline are as before) and transparent; forced colours would repaint it, so it keeps its own colour there. Its letter-spacing is 0: the bar's .05em tracking would make the absolute o wider than .o's fixed box, so .o would hold more than it shows (a3b-screens, Nov 6); the egg's spacing is .o's own margins. scripts/lockup-name.ts diffs the pixels and measures that spill. */
.gg .oc { position: absolute; color: transparent; letter-spacing: 0; }
@media (forced-colors: active) { .gg .oc { forced-color-adjust: none; } }
.gg-bar { --mark-track: .05em; font-size: 22px; }
.gg-bar .o { width: .55em; height: .68em; margin: 0 .03em 0 .02em; }
.gg-share { font-size: 40px; }
.gg-end { --mark-w: 300; --mark-track: -.03em; font-size: 96px; }
@media (max-width: 720px) { .gg-bar { font-size: 20px; } }
</style>
